<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Anitha's Karate</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root {
      --primary-red: #d32f2f;
      --accent-yellow: #ffeb3b;
      --dark-bg: #0a0a0c;
      --light-text: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
      /* High-end global margin */
      --site-margin: 10%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--light-text);
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
      /* Large margins for a focused experience */
      padding: 40px var(--site-margin);
    }

    /* Fixed Top-Left Back Button */
    .back-btn-container {
      position: absolute;
      top: 40px;
      left: var(--site-margin);
      z-index: 100;
    }

    .back-btn {
      text-decoration: none;
      color: var(--light-text);
      font-weight: 700;
      font-family: "Montserrat", sans-serif;
      font-size: 0.85rem;
      border: 1px solid var(--glass-border);
      padding: 12px 24px;
      border-radius: 50px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: var(--glass-bg);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      backdrop-filter: blur(10px);
    }

    .back-btn:hover {
      background: var(--primary-red);
      border-color: var(--primary-red);
      transform: translateX(-8px);
    }

    /* Header */
    header {
      padding: 80px 0 60px;
      text-align: center;
    }

    .logo-text {
      font-family: "Montserrat", sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 5px;
      opacity: 0.5;
      margin-bottom: 15px;
    }

    h1 {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      text-transform: uppercase;
      line-height: 0.9;
    }

    .text-red {
      color: var(--primary-red);
    }

    .text-yellow {
      color: var(--accent-yellow);
    }

    /* The Cinematic Grid (16:9 Ratio) */
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      /* Adjusted gap for wider images */
      max-width: 1800px;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      /* Landscape Camera Ratio */
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      transition: all 0.7s cubic-bezier(0.15, 0.83, 0.66, 1);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.9s ease;
    }

    .gallery-item:hover {
      transform: scale(1.03) translateY(-10px);
      border-color: var(--accent-yellow);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
      z-index: 5;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    /* --- MEDIA QUERIES --- */

    /* Tablets (2 Columns) */
    @media (max-width: 1100px) {
      :root {
        --site-margin: 6%;
      }

      .gallery-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
      }

      h1 {
        font-size: 3.5rem;
      }
    }

    /* Mobile Phones (1 Column) */
    @media (max-width: 768px) {
      :root {
        --site-margin: 5%;
      }

      body {
        padding: 120px 5% 40px;
      }

      .back-btn-container {
        top: 30px;
        left: 5%;
      }

      .gallery-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      h1 {
        font-size: 2.5rem;
      }
    }

    footer {
      text-align: center;
      padding: 100px 0 60px;
      color: #333;
      font-family: "Montserrat", sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 0.75rem;
    }
  </style>
</head>

<body>

  <div class="back-btn-container">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Home
    </a>
  </div>

  <header>
    <div class="logo-text">ANITHA KARATE<span class="text-red">.COM</span></div>
    <h1>CINEMATIC <span class="text-yellow">GALLERY</span></h1>
  </header>

  <main class="gallery-container">
    <div class="gallery-item"><img src="images/Gallary/G1.jpeg" alt="G1"></div>
    <div class="gallery-item"><img src="images/Students/S1.jpeg" alt="S1"></div>
    <div class="gallery-item"><img src="images/Gallary/G2.jpeg" alt="G2"></div>
    <div class="gallery-item"><img src="images/Students/S2.jpeg" alt="S2"></div>
    <div class="gallery-item"><img src="images/Gallary/G3.jpeg" alt="G3"></div>
    <div class="gallery-item"><img src="images/Students/S3.jpeg" alt="S3"></div>
    <div class="gallery-item"><img src="images/Gallary/G4.jpeg" alt="G4"></div>
    <div class="gallery-item"><img src="images/Students/S4.jpeg" alt="S4"></div>
    <div class="gallery-item"><img src="images/Gallary/G5.jpeg" alt="G5"></div>
  </main>

  <footer>
    © 2026 CRAFTED BY HK
  </footer>

  <script>
    // Fade-in entry for images
    document.addEventListener('DOMContentLoaded', () => {
      const items = document.querySelectorAll('.gallery-item');
      items.forEach((item, index) => {
        item.style.opacity = '0';
        item.style.transform = 'translateY(30px)';
        setTimeout(() => {
          item.style.transition = 'all 0.8s ease-out';
          item.style.opacity = '1';
          item.style.transform = 'translateY(0)';
        }, index * 80);
      });
    });
  </script>
</body>

</html>
